<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grass" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#6BA83B"/>
      <rect width="20" height="20" fill="#7BC44A"/>
      <rect x="20" y="20" width="20" height="20" fill="#7BC44A"/>
      <rect width="20" height="20" x="20" fill="#5FA032"/>
      <rect width="20" height="20" y="20" fill="#5FA032"/>
    </pattern>
    <pattern id="dirt" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#7A5230"/>
      <rect width="20" height="20" fill="#6E4A2A"/>
      <rect x="20" y="20" width="20" height="20" fill="#6E4A2A"/>
      <rect width="20" height="20" x="20" fill="#8A5F38"/>
      <rect width="20" height="20" y="20" fill="#8A5F38"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="36" fill="url(#grass)"/>
  <rect x="0" y="36" width="1000" height="184" fill="url(#dirt)"/>

  <rect x="90" y="55" width="820" height="120" fill="#C6A664" stroke="#4E3620" stroke-width="8"/>
  <rect x="98" y="63" width="804" height="104" fill="#A9814E" stroke="#3B2A18" stroke-width="4"/>

  <text x="500" y="112" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold"
        font-size="42" letter-spacing="3" fill="#FFFFFF" stroke="#2B1A0E" stroke-width="6" paint-order="stroke">
    LOKESH SATI
  </text>
  <text x="503" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold"
        font-size="22" letter-spacing="4" fill="#FFF7B0" stroke="#2B1A0E" stroke-width="4" paint-order="stroke">
    ( LUCKY ) — SOFTWARE DEVELOPER
  </text>

  <!-- Torch left -->
  <g transform="translate(50,60)">
    <rect x="6" y="20" width="8" height="40" fill="#5B3A21"/>
    <rect x="0" y="10" width="20" height="12" fill="#8B5A2B"/>
    <polygon points="10,-16 0,10 20,10" fill="#FFB300">
      <animate attributeName="fill" values="#FFB300;#FF7A00;#FFD54F;#FFB300" dur="0.6s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="10,-10 3,10 17,10" fill="#FFEE58">
      <animate attributeName="points" values="10,-10 3,10 17,10;10,-14 4,10 16,10;10,-8 3,10 17,10;10,-10 3,10 17,10" dur="0.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Torch right -->
  <g transform="translate(940,60)">
    <rect x="6" y="20" width="8" height="40" fill="#5B3A21"/>
    <rect x="0" y="10" width="20" height="12" fill="#8B5A2B"/>
    <polygon points="10,-16 0,10 20,10" fill="#FFB300">
      <animate attributeName="fill" values="#FF7A00;#FFB300;#FFD54F;#FF7A00" dur="0.7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="10,-10 3,10 17,10" fill="#FFEE58">
      <animate attributeName="points" values="10,-8 3,10 17,10;10,-14 4,10 16,10;10,-10 3,10 17,10;10,-8 3,10 17,10" dur="0.55s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Bouncing emerald -->
  <g transform="translate(500,30)">
    <animateTransform attributeName="transform" type="translate" values="500,30;500,18;500,30" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#2ECC71" stroke="#1B7A44" stroke-width="2"/>
    <polygon points="0,-14 6,-6 -6,-6" fill="#7CF0A8"/>
  </g>

  <rect x="0" y="204" width="1000" height="16" fill="url(#dirt)"/>
</svg>
